<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Dynamic festive icon + manifest switcher (like Duolingo) -->
    <script>
      (function () {
        // IST date
        var now = new Date();
        var ist = new Date(now.getTime() + 5.5 * 3600000);
        var m = ist.getUTCMonth() + 1;
        var d = ist.getUTCDate();

        var icon    = '/icon-192.png';
        var manifest = '/manifest.json';
        var themeColor = '#1db954';
        var title   = 'TuneTastic Premium';

        if      (m===1  && d<=2)           { icon='/icon-newyear.png';      manifest='/manifest-newyear.json';      themeColor='#FFD700'; title='TuneTastic 🎆'; }
        else if (m===1  && d>=26 && d<=27) { icon='/icon-independence.png'; manifest='/manifest-independence.json'; themeColor='#FF9933'; title='TuneTastic 🇮🇳'; }
        else if (m===2  && d>=14 && d<=15) { icon='/icon-192.png';          manifest='/manifest.json';              themeColor='#e91e8c'; title='TuneTastic 💖'; }
        else if (m===3  && d>=1  && d<=3)  { icon='/icon-holi.png';         manifest='/manifest-holi.json';         themeColor='#FF4081'; title='TuneTastic 🎨'; }
        else if (m===8  && d>=14 && d<=16) { icon='/icon-independence.png'; manifest='/manifest-independence.json'; themeColor='#FF9933'; title='TuneTastic 🇮🇳'; }
        else if (m===10 && d>=15 && d<=27) { icon='/icon-diwali.png';       manifest='/manifest-diwali.json';       themeColor='#FFB300'; title='TuneTastic 🪔'; }
        else if (m===12 && d>=24 && d<=26) { icon='/icon-christmas.png';    manifest='/manifest-christmas.json';    themeColor='#00C853'; title='TuneTastic 🎄'; }
        else if (m===12 && d>=31)          { icon='/icon-newyear.png';      manifest='/manifest-newyear.json';      themeColor='#FFD700'; title='TuneTastic 🥂'; }

        // Inject into <head>
        document.write(
          '<link rel="icon" type="image/png" href="' + icon + '">' +
          '<link rel="apple-touch-icon" href="' + icon + '">' +
          '<link rel="manifest" href="' + manifest + '">' +
          '<meta name="theme-color" content="' + themeColor + '">'
        );
        document.title = title + ' — Web Player';
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TuneTastic" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TuneTastic Premium — Web Player</title>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA installability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js').catch(function(err) {
            console.log('SW registration error:', err);
          });
        });
      }

      // Automatically trigger the default browser installation notification/prompt
      (function() {
        // Do not prompt if already running in standalone/installed mode
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (isStandalone) return;

        var deferredPrompt = null;
        var hasTriggered = false;

        function promptInstall() {
          if (!deferredPrompt || hasTriggered) return;
          hasTriggered = true;
          try {
            deferredPrompt.prompt().then(function() {
              return deferredPrompt.userChoice;
            }).then(function(choiceResult) {
              console.log('Native browser install choice:', choiceResult ? choiceResult.outcome : 'unknown');
              deferredPrompt = null;
            }).catch(function(err) {
              console.log('Default prompt deferred for gesture:', err);
              hasTriggered = false;
            });
          } catch (e) {
            hasTriggered = false;
          }
        }

        // When the browser detects PWA installability, capture the native event
        window.addEventListener('beforeinstallprompt', function(e) {
          deferredPrompt = e;
          // Attempt default browser prompt immediately upon page load
          promptInstall();
        });

        // For browsers requiring a user gesture before showing native prompt,
        // trigger the default browser prompt on the very first tap/click anywhere
        var gestureEvents = ['click', 'touchstart', 'pointerdown'];
        function onGesture() {
          if (deferredPrompt && !hasTriggered) {
            promptInstall();
          }
        }
        gestureEvents.forEach(function(evt) {
          window.addEventListener(evt, onGesture, { passive: true });
        });

        window.addEventListener('appinstalled', function() {
          deferredPrompt = null;
          hasTriggered = true;
          gestureEvents.forEach(function(evt) {
            window.removeEventListener(evt, onGesture);
          });
          console.log('TuneTastic installed');
        });
      })();
    </script>
  </body>
</html>
